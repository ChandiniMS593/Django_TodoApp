name: Deploy To SSP Environment.

on:
  push:
    branches: ["develop"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect Git metadata
        id: gitinfo
        run: |
          echo "GIT_REPO_URL=$(git config --get remote.origin.url | sed 's/.git$//')" >> $GITHUB_ENV
          echo "GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
          echo "GIT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "GIT_MESSAGE=$(git log -1 --pretty=%s)" >> $GITHUB_ENV
          echo "GIT_TIMESTAMP=$(git log -1 --pretty=%cI)" >> $GITHUB_ENV

      - name: Create GitHub-style payload
        run: |
          cat > payload.json << EOF
          {
          "ref": "refs/heads/${GIT_BRANCH}",
          "repository": {
            "html_url": "${GIT_REPO_URL}"
          },
          "head_commit": {
              "id": "${GIT_COMMIT}",
              "message": "${GIT_MESSAGE}",
              "timestamp": "${GIT_TIMESTAMP}"
            }
          }
          EOF
          jq -c . payload.json | tr -d '' > payload_compact.json
          mv payload_compact.json payload.json
          perl -pi -e 'chomp if eof' payload.json

      - name: Trigger internal SSP webhook handler
        env:
          WEBHOOK_SECRET: ${{ secrets.SSP_SECRET }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          CLEAN_SECRET=$(printf '%s' "$WEBHOOK_SECRET" | tr -d '')
          SIGNATURE=$(openssl dgst -sha256 -hmac "$CLEAN_SECRET" payload.json | awk '{print $2}')
          curl -k -X POST "${{ secrets.SSP_DEPLOY_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -H "X-SSP-IMAGE: $IMAGE_NAME" \
            -H "X-SSP-TAG: $GITHUB_SHA" \
            -H "X-SSP-PATH: k8s//" \
            -d @payload.json
